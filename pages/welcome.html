<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Welcome to Morning Brief</title>
  <link rel="preload" href="../fonts/thmanyah-sans-400.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="../fonts/thmanyah-serif-display-700.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="../css/app.css">
  <link rel="stylesheet" href="../css/welcome.css">
</head>
<body data-time="morning" data-tone="light">
  <header class="hero">
    <canvas class="scene" aria-hidden="true"></canvas>
    <nav class="bar">
      <span class="wordmark"></span>
      <p class="bar-note num" aria-live="polite"></p>
    </nav>
    <div class="hello">
      <p class="greeting"></p>
      <p class="when"></p>
    </div>
  </header>
  <main class="page ob">
    <p class="demo-banner" hidden></p>
    <section id="step"></section>
    <footer class="ob-nav">
      <button type="button" class="btn ghost" id="back"></button>
      <span class="spacer"></span>
      <button type="button" class="btn primary" id="next"></button>
    </footer>
  </main>
  <script type="module" src="welcome.js"></script>
</body>
</html>
